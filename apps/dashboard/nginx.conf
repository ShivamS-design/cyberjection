# Template rendered by the base nginx image's docker-entrypoint.sh
# (envsubst over /etc/nginx/templates/*.template -> /etc/nginx/conf.d/) --
# see Dockerfile's comment on API_UPSTREAM. Only ${API_UPSTREAM} is
# meant to be substituted; nginx's own $uri/$host variables are escaped
# below so envsubst doesn't try (and fail) to expand them.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The dashboard is a client-side-routed single-page app (see
    # apps/dashboard/src/App.tsx's <Routes>) -- any path that isn't a
    # real static asset falls back to index.html so a deep link like
    # /campaigns/<id> reloads correctly instead of nginx 404ing it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Every dashboard API call is a relative /api/... path (see
    # apps/dashboard/src/api/client.ts), proxied here to the backend
    # service instead of being served as a static file.
    location /api/ {
        proxy_pass ${API_UPSTREAM}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}

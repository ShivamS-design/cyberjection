# CI for Cyberjection: tests, static checks, dashboard build, packaging,
# the security-evaluation quality gate (Phase 6) and the hardening gate
# (Phase 8).
#
# Every third-party action is pinned to a full commit SHA (the tag is in
# the trailing comment; Dependabot keeps them current, see
# .github/dependabot.yml) and the default token is read-only -- jobs that
# need more ask for it explicitly. A security tool's own pipeline shouldn't
# be its weakest supply-chain link.
name: Cyberjection AI Security Evaluation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,security]"
      - name: Unit tests with coverage
        # The Phase 7 distributed tests run against in-memory `fakeredis`
        # servers (see the `_redis_backend` fixture in tests/conftest.py);
        # set CYBERJECTION_TEST_REDIS_URL to run them against a real Redis.
        run: pytest tests/unit/ -q --cov=cyberjection --cov-report=term --cov-fail-under=90

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]" ruff uv
      - name: Lockfile is current
        run: uv lock --check
      - name: Lint
        run: ruff check cyberjection tests
      - name: Type check
        run: mypy cyberjection/

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run build

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/cyberjection --version
          /tmp/smoke/bin/cyberjection hubguard --help > /dev/null

  security-eval:
    runs-on: ubuntu-latest
    needs: tests
    # `upload-sarif` needs write access to the Security tab's code-scanning
    # alerts.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Cyberjection security evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cyberjection run \
            --config examples/quickstart.yaml \
            --target support-agent \
            --threshold 7.0 \
            --sarif-out results.sarif \
            --json-out results.json
      - name: Upload SARIF report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
      - name: Upload JSON/SARIF artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cyberjection-reports
          path: |
            results.sarif
            results.json

  hardening-gate:
    # Phase 8: dependency vulnerability + hardcoded-secret gate, kept as its
    # own job so a hardening finding is reported distinctly from an
    # evaluation quality-gate failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies (including the security extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,security]"
      - name: Run dependency + secret audit
        # `--path` restricts the secrets scan to the source tree: the tests
        # deliberately contain credential-shaped fixtures.
        run: |
          cyberjection audit \
            --deps \
            --secrets \
            --path cyberjection \
            --path examples \
            --path apps/dashboard/src \
            --fail-on-unavailable \
            --report hardening-report.md
      - name: Upload hardening report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cyberjection-hardening-report
          path: hardening-report.md

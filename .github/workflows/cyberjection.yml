# Reusable CI/CD security evaluation gate (Phase 6, Task 6.4; Phase 8 adds
# the standing hardening-gate job).
#
# The Phase 6 design spec's own workflow sketch installs dependencies via
# `pip install poetry && poetry install` and invokes `poetry run cyberjection
# ...`. This project has never used Poetry -- `pyproject.toml` has declared
# a `hatchling` build backend with a plain `pip install -e ".[dev]"` install
# flow since Phase 1, and there is no `poetry.lock` anywhere in the repo.
# Adopting Poetry here would mean introducing a second, parallel dependency
# manager for one workflow file. This workflow installs and invokes the
# project the same way every other phase's documented Quickstart does.
name: Cyberjection AI Security Evaluation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  security-eval:
    runs-on: ubuntu-latest
    # `upload-sarif` needs write access to the Security tab's code-scanning
    # alerts -- without this, the step 403s on any run triggered by a fork
    # PR or a repo with the default (more restrictive) `GITHUB_TOKEN` perms.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit test suite
        # The Phase 7 distributed tests run against in-memory `fakeredis`
        # servers (a dev dependency that also executes the rate limiter's
        # real Lua script) -- see the `_redis_backend` fixture in
        # tests/conftest.py. No Redis service or container is needed. To
        # run them against a real server instead, set
        # CYBERJECTION_TEST_REDIS_URL=redis://host:6379.
        run: pytest tests/unit/ -v

      - name: Run Cyberjection security evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cyberjection run \
            --config examples/quickstart.yaml \
            --target support-agent \
            --threshold 7.0 \
            --sarif-out results.sarif \
            --json-out results.json

      - name: Upload SARIF report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif

      - name: Upload JSON/SARIF artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cyberjection-reports
          path: |
            results.sarif
            results.json

  hardening-gate:
    # Phase 8: dependency vulnerability + hardcoded-secret gate. Runs as its
    # own job (not appended to security-eval) so a hardening finding is
    # reported distinctly from an evaluation quality-gate failure in the
    # GitHub Actions UI, and so the job list mirrors the two independent
    # `cyberjection audit --deps` / `--secrets` checks a maintainer can also
    # run locally.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (including the security extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,security]"

      - name: Run dependency + secret audit
        # `--path` restricts the secrets scan to the actual source tree.
        # Without it, `cyberjection audit --secrets` defaults to scanning
        # the whole checked-out repo -- including tests/unit/test_*.py,
        # which deliberately contains synthetic credential-shaped strings
        # (fake AWS access keys, a fake Slack token, etc.) to test the
        # scanner's own pattern matching. Scanning those files in CI made
        # every single run of this job fail on findings that are test
        # fixtures, not leaked secrets.
        run: |
          cyberjection audit \
            --deps \
            --secrets \
            --path cyberjection \
            --path examples \
            --path apps \
            --fail-on-unavailable \
            --report hardening-report.md

      - name: Upload hardening report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cyberjection-hardening-report
          path: hardening-report.md

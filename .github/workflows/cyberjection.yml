# Reusable CI/CD security evaluation gate (Phase 6, Task 6.4; Phase 8 adds
# the standing hardening-gate job).
#
# The Phase 6 design spec's own workflow sketch installs dependencies via
# `pip install poetry && poetry install` and invokes `poetry run cyberjection
# ...`. This project has never used Poetry -- `pyproject.toml` has declared
# a `hatchling` build backend with a plain `pip install -e ".[dev]"` install
# flow since Phase 1, and there is no `poetry.lock` anywhere in the repo.
# Adopting Poetry here would mean introducing a second, parallel dependency
# manager for one workflow file. This workflow installs and invokes the
# project the same way every other phase's documented Quickstart does.
name: Cyberjection AI Security Evaluation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  security-eval:
    runs-on: ubuntu-latest
    # `upload-sarif` needs write access to the Security tab's code-scanning
    # alerts -- without this, the step 403s on any run triggered by a fork
    # PR or a repo with the default (more restrictive) `GITHUB_TOKEN` perms.
    permissions:
      contents: read
      security-events: write
    services:
      # Backs `cyberjection.distributed.{rate_limiter,coordinator}`'s real
      # `redis.asyncio` client for the unit suite's Pub/Sub and token-bucket
      # tests (as opposed to the offline in-memory double those modules'
      # own test files document as the *local* dev/sandbox fallback).
      # `ports: ["6379:6379"]` publishes the container's port onto the
      # runner's own `localhost`, which is what every hostname below is
      # aliased to.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Alias per-test Redis hostnames to localhost
        # test_rate_limiter.py / test_coordinator.py deliberately construct
        # each `DistributedRateLimiter` / `DistributedClusterCoordinator`
        # against a distinct fake hostname (redis://test-rl-1/0 ..
        # test-rl-9/0, redis://test-coord-1/0 .. test-coord-10/0) so that
        # tests run concurrently against a shared local dev Redis don't see
        # each other's keys/channels. The real `redis` package resolves
        # these as DNS names, which don't exist -- aliasing them to
        # 127.0.0.1 here (where the `redis:` service above is published)
        # keeps that per-test isolation design (distinct Redis *logical*
        # connections, same server) working against a genuine Redis server
        # in CI instead of only against the offline in-memory double.
        run: |
          for host in test-rl-1 test-rl-2 test-rl-3 test-rl-4 test-rl-5 test-rl-6 test-rl-7 test-rl-8 test-rl-9 \
                      test-coord-1 test-coord-2 test-coord-3 test-coord-4 test-coord-5 test-coord-6 test-coord-7 test-coord-8 test-coord-9 test-coord-10; do
            echo "127.0.0.1 $host" | sudo tee -a /etc/hosts
          done

      - name: Run unit test suite
        run: pytest tests/unit/ -v

      - name: Run Cyberjection security evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cyberjection run \
            --config examples/quickstart.yaml \
            --target support-agent \
            --threshold 7.0 \
            --sarif-out results.sarif \
            --json-out results.json

      - name: Upload SARIF report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif

      - name: Upload JSON/SARIF artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cyberjection-reports
          path: |
            results.sarif
            results.json

  hardening-gate:
    # Phase 8: dependency vulnerability + hardcoded-secret gate. Runs as its
    # own job (not appended to security-eval) so a hardening finding is
    # reported distinctly from an evaluation quality-gate failure in the
    # GitHub Actions UI, and so the job list mirrors the two independent
    # `cyberjection audit --deps` / `--secrets` checks a maintainer can also
    # run locally.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (including the security extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,security]"

      - name: Run dependency + secret audit
        # `--path` restricts the secrets scan to the actual source tree.
        # Without it, `cyberjection audit --secrets` defaults to scanning
        # the whole checked-out repo -- including tests/unit/test_*.py,
        # which deliberately contains synthetic credential-shaped strings
        # (fake AWS access keys, a fake Slack token, etc.) to test the
        # scanner's own pattern matching. Scanning those files in CI made
        # every single run of this job fail on findings that are test
        # fixtures, not leaked secrets.
        run: |
          cyberjection audit \
            --deps \
            --secrets \
            --path cyberjection \
            --path examples \
            --path apps \
            --fail-on-unavailable \
            --report hardening-report.md

      - name: Upload hardening report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cyberjection-hardening-report
          path: hardening-report.md

name: Cyberjection AI Security Gate
description: >-
  Adversarial LLM regression testing and model supply-chain scanning in CI.
  Fails the build when a prompt change drops resilience below your threshold,
  or when a Hugging Face model repository is unsafe to load.
author: ShivamS-design
branding:
  icon: shield
  color: red

inputs:
  command:
    description: "What to run: run | hubguard-gate | hubguard-scan | audit"
    required: false
    default: run
  config:
    description: Campaign YAML (run, hubguard-gate)
    required: false
    default: cyberjection.yaml
  target:
    description: Target id to evaluate (run)
    required: false
    default: ""
  threshold:
    description: Quality-gate threshold 0-10 (run); defaults to the campaign's
    required: false
    default: ""
  repo-id:
    description: Hugging Face repo id (hubguard-scan)
    required: false
    default: ""
  local-only:
    description: Pass --local-only to `run`
    required: false
    default: "false"
  sarif-file:
    description: Where to write SARIF (run, hubguard-scan); empty to skip
    required: false
    default: cyberjection.sarif
  upload-sarif:
    description: Upload SARIF to GitHub code scanning (needs security-events write)
    required: false
    default: "true"
  python-version:
    description: Python version to run Cyberjection with
    required: false
    default: "3.12"
  cyberjection-version:
    description: Version spec to install from PyPI, or "source" to install this action's own checkout
    required: false
    default: source

outputs:
  exit-code:
    description: "Cyberjection's exit code (0 pass, 1 quality gate failed, 4 supply chain blocked, 5 budget exceeded)"
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Cyberjection
      shell: bash
      env:
        SPEC: ${{ inputs.cyberjection-version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        if [ "$SPEC" = "source" ]; then
          python -m pip install "$ACTION_PATH"
        else
          python -m pip install "cyberjection$SPEC"
        fi

    - name: Run Cyberjection
      id: run
      shell: bash
      # Inputs go through env vars, never interpolated into the script, so a
      # crafted input can't inject shell syntax.
      env:
        COMMAND: ${{ inputs.command }}
        CONFIG: ${{ inputs.config }}
        TARGET: ${{ inputs.target }}
        THRESHOLD: ${{ inputs.threshold }}
        REPO_ID: ${{ inputs.repo-id }}
        LOCAL_ONLY: ${{ inputs.local-only }}
        SARIF: ${{ inputs.sarif-file }}
      run: |
        set +e
        args=()
        case "$COMMAND" in
          run)
            args=(run --config "$CONFIG" --target "$TARGET")
            [ -n "$THRESHOLD" ] && args+=(--threshold "$THRESHOLD")
            [ "$LOCAL_ONLY" = "true" ] && args+=(--local-only)
            [ -n "$SARIF" ] && args+=(--sarif-out "$SARIF")
            ;;
          hubguard-gate) args=(hubguard gate --config "$CONFIG") ;;
          hubguard-scan)
            args=(hubguard scan "$REPO_ID")
            [ -n "$SARIF" ] && args+=(--sarif-out "$SARIF")
            ;;
          audit) args=(audit --deps --secrets --fail-on-unavailable) ;;
          *) echo "::error::unknown command '$COMMAND'"; exit 2 ;;
        esac
        cyberjection "${args[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit $code

    - name: Upload SARIF
      if: always() && inputs.upload-sarif == 'true' && inputs.sarif-file != '' && hashFiles(inputs.sarif-file) != ''
      uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: cyberjection
